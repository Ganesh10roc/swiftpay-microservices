name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Unit Tests
        run: mvn test

      - name: Run Integration Tests
        run: mvn verify -DskipITs=false

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ 'transaction-gateway', 'ledger-service', 'analytics-worker' ]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: swiftpay/${{ matrix.service }}:latest

  docker-compose-test:
    needs: docker-build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: swiftpay
          POSTGRES_USER: swiftpay
          POSTGRES_PASSWORD: swiftpay_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Verify docker-compose configuration
        run: docker-compose config

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check code style
        run: mvn checkstyle:check || true

      - name: Build for analysis
        run: mvn clean compile -DskipTests
